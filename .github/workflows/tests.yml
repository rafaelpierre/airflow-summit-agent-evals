name: Evaluation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q
