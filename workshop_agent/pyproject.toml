[project]
name = "workshop-text2sql-cli"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-ai-slim[openai]==2.65.0",
    "sqlalchemy>=2.0,<3",
    "nltk>=3.9.4",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "openinference-instrumentation-pydantic-ai",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../apps/agentic-text2sql"]
